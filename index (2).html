<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wirtsbuch · Verbrauchsverteilung</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
  <style>
    body { margin: 0; background: #F4ECDD; font-family: "Manrope", system-ui, sans-serif; color: #1F1611; }
    .display { font-family: "Fraunces", Georgia, serif; font-optical-sizing: auto; }
    .closed-stripe { background-image: repeating-linear-gradient(45deg, transparent, transparent 4px, rgba(160,64,48,0.18) 4px, rgba(160,64,48,0.18) 6px); }
    input[type=number]::-webkit-inner-spin-button { opacity: 0.3; }
  </style>
</head>
<body>
  <div id="root">
    <div style="font-family: system-ui, sans-serif; padding: 4rem 2rem; text-align: center; color: #6B5D52;">
      <div style="font-size: 1.2rem; margin-bottom: 0.5rem;">Wirtsbuch wird geladen…</div>
      <div style="font-size: 0.85rem;">React, Tailwind und Babel werden aus dem CDN geladen.</div>
      <div id="loaderStatus" style="margin-top: 1.5rem; font-size: 0.8rem;"></div>
    </div>
  </div>
  <script>
    // Diagnose: zeigt nach 6s, falls etwas nicht geladen ist
    window.addEventListener('error', function(e) {
      if (e.target && e.target.tagName === 'SCRIPT' && e.target.src) {
        const root = document.getElementById('root');
        if (root) root.innerHTML = '<div style="font-family: system-ui, sans-serif; padding: 3rem 2rem; max-width: 600px; margin: 0 auto; color: #A04030;"><h2 style="margin-top:0;">CDN-Skript blockiert</h2><p>Die Datei kann ein nötiges Skript nicht laden:</p><p style="font-family: monospace; background: #FAF5E9; padding: 0.5rem; border-radius: 4px; word-break: break-all;">' + e.target.src + '</p><p>Mögliche Ursachen: Firewall, Ad-Blocker, oder kein Internet-Zugang.</p></div>';
      }
    }, true);
    setTimeout(function() {
      const status = document.getElementById('loaderStatus');
      if (!status) return;
      const checks = [
        ['Tailwind',    typeof window.tailwind !== 'undefined'],
        ['React',       typeof window.React !== 'undefined'],
        ['ReactDOM',    typeof window.ReactDOM !== 'undefined'],
        ['Babel',       typeof window.Babel !== 'undefined'],
      ];
      const missing = checks.filter(c => !c[1]).map(c => c[0]);
      if (missing.length > 0) {
        status.innerHTML = '<span style="color:#A04030;">Fehlend: ' + missing.join(', ') + ' – CDN nicht erreichbar?</span>';
      } else {
        status.innerHTML = '<span style="color:#A04030;">Alle Skripte geladen, aber React rendert nicht. Bitte Konsole prüfen (F12).</span>';
      }
    }, 6000);
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useMemo, useEffect, useRef } = React;

    // ─── Inline SVG-Icons (Lucide-Stil) ────────────────────────────────────
    const SvgIcon = ({ children, size = 16, ...props }) => (
      <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}>{children}</svg>
    );
    const Plus            = (p) => <SvgIcon {...p}><path d="M5 12h14"/><path d="M12 5v14"/></SvgIcon>;
    const Trash2          = (p) => <SvgIcon {...p}><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></SvgIcon>;
    const Download        = (p) => <SvgIcon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></SvgIcon>;
    const ChevronLeft     = (p) => <SvgIcon {...p}><path d="m15 18-6-6 6-6"/></SvgIcon>;
    const ChevronRight    = (p) => <SvgIcon {...p}><path d="m9 18 6-6-6-6"/></SvgIcon>;
    const Beer            = (p) => <SvgIcon {...p}><path d="M17 11h1a3 3 0 0 1 0 6h-1"/><path d="M9 12v6"/><path d="M13 12v6"/><path d="M14 7.5c-1 0-1.44.5-3 .5s-2-.5-3-.5-1.72.5-2.5.5a2.5 2.5 0 0 1 0-5c.78 0 1.57.5 2.5.5C9.44 3.5 10 3 12 3s2.56.5 3.5.5c.93 0 1.72-.5 2.5-.5a2.5 2.5 0 0 1 0 5c-.78 0-1.5-.5-2.5-.5Z"/><path d="M5 8v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V8"/></SvgIcon>;
    const UtensilsCrossed = (p) => <SvgIcon {...p}><path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8"/><path d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7"/><path d="m2.1 21.8 6.4-6.3"/><path d="m19 5-7 7"/></SvgIcon>;
    const Shuffle         = (p) => <SvgIcon {...p}><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></SvgIcon>;
    const Info            = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></SvgIcon>;
    const RotateCcw       = (p) => <SvgIcon {...p}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></SvgIcon>;
    const AlertTriangle   = (p) => <SvgIcon {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></SvgIcon>;
    const Pencil          = (p) => <SvgIcon {...p}><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></SvgIcon>;
    const Camera          = (p) => <SvgIcon {...p}><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></SvgIcon>;
    const X               = (p) => <SvgIcon {...p}><path d="M18 6 6 18"/><path d="m6 6 12 12"/></SvgIcon>;

    // ─── Konstanten ────────────────────────────────────────────────────────
    const WEEKDAYS_SHORT = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];
    const WEEKDAYS_LONG = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
    const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
    const DAY_WEIGHTS = { 0: 1.55, 1: 0.85, 2: 0.90, 3: 0.00, 4: 1.00, 5: 1.35, 6: 1.80 };

    // ─── Helpers ───────────────────────────────────────────────────────────
    function seededRandom(seed) {
      let h = seed | 0;
      h = Math.imul(h ^ (h >>> 16), 0x45d9f3b);
      h = Math.imul(h ^ (h >>> 16), 0x45d9f3b);
      h = h ^ (h >>> 16);
      let s = h % 2147483647;
      if (s <= 0) s += 2147483646;
      return () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
    }

    function dateToStr(y, m, d) {
      return `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    }

    function distributeAmount(total, openDays, overrides, seed) {
      const result = {};
      openDays.forEach(d => { result[d.date] = 0; });
      let usedByOverrides = 0;
      const overriddenSet = new Set();
      for (const d of openDays) {
        if (overrides && Object.prototype.hasOwnProperty.call(overrides, d.date)) {
          result[d.date] = overrides[d.date];
          usedByOverrides += overrides[d.date];
          overriddenSet.add(d.date);
        }
      }
      const remDays = openDays.filter(d => !overriddenSet.has(d.date));
      const remTotal = Math.max(0, total - usedByOverrides);
      if (remDays.length === 0 || remTotal === 0) return result;
      const rng = seededRandom(seed);
      const weights = remDays.map(d => DAY_WEIGHTS[d.dayOfWeek] * (0.65 + rng() * 0.7));
      const sum = weights.reduce((a, b) => a + b, 0);
      const raw = weights.map(w => (w / sum) * remTotal);
      const floored = raw.map(v => Math.floor(v));
      let rem = remTotal - floored.reduce((a, b) => a + b, 0);
      const fracs = raw.map((v, i) => ({ i, frac: v - Math.floor(v) })).sort((a, b) => b.frac - a.frac);
      const out = [...floored];
      for (let i = 0; i < rem && i < fracs.length; i++) out[fracs[i].i]++;
      remDays.forEach((d, i) => { result[d.date] = out[i]; });
      return result;
    }

    // ─── Bayerische Feiertage ──────────────────────────────────────────────
    function computeEaster(year) {
      const a = year % 19, b = Math.floor(year / 100), c = year % 100;
      const d = Math.floor(b / 4), e = b % 4;
      const f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4), k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const monthZ = Math.floor((h + l - 7 * m + 114) / 31) - 1;
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(year, monthZ, day);
    }
    function addDays(date, n) { const r = new Date(date); r.setDate(r.getDate() + n); return r; }
    function fmt(d) { return dateToStr(d.getFullYear(), d.getMonth(), d.getDate()); }

    function getBavarianHolidays(year) {
      const easter = computeEaster(year);
      return {
        [dateToStr(year, 0, 1)]: 'Neujahr',
        [dateToStr(year, 0, 6)]: 'Heilige Drei Könige',
        [fmt(addDays(easter, -2))]: 'Karfreitag',
        [fmt(addDays(easter, 1))]: 'Ostermontag',
        [dateToStr(year, 4, 1)]: 'Tag der Arbeit',
        [fmt(addDays(easter, 39))]: 'Christi Himmelfahrt',
        [fmt(addDays(easter, 50))]: 'Pfingstmontag',
        [fmt(addDays(easter, 60))]: 'Fronleichnam',
        [dateToStr(year, 7, 15)]: 'Mariä Himmelfahrt',
        [dateToStr(year, 9, 3)]: 'Tag der Deutschen Einheit',
        [dateToStr(year, 10, 1)]: 'Allerheiligen',
        [dateToStr(year, 11, 25)]: '1. Weihnachtstag',
        [dateToStr(year, 11, 26)]: '2. Weihnachtstag',
      };
    }

    // ─── Storage (localStorage) ────────────────────────────────────────────
    function loadKey(key) {
      try {
        const v = localStorage.getItem(key);
        return v != null ? JSON.parse(v) : null;
      } catch (e) { return null; }
    }
    function saveKey(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    // ─── ValueCell ─────────────────────────────────────────────────────────
    function ValueCell({ value, isOverride, onSet, onClear, accent, disabled }) {
      const [editing, setEditing] = useState(false);
      const [local, setLocal] = useState(String(value));
      const inputRef = useRef(null);
      useEffect(() => { if (!editing) setLocal(String(value)); }, [value, editing]);
      useEffect(() => { if (editing && inputRef.current) { inputRef.current.focus(); inputRef.current.select(); } }, [editing]);

      if (disabled) return <div className="text-right" style={{ color: '#C9BCA0' }}>—</div>;

      if (editing) {
        return (
          <input
            ref={inputRef}
            type="number"
            min="0"
            value={local}
            onChange={(e) => setLocal(e.target.value)}
            onBlur={() => { setEditing(false); onSet(Math.max(0, parseInt(local) || 0)); }}
            onKeyDown={(e) => {
              if (e.key === 'Enter') e.target.blur();
              if (e.key === 'Escape') { setLocal(String(value)); setEditing(false); }
            }}
            className="w-16 px-2 py-1 text-right tabular-nums rounded text-sm focus:outline-none"
            style={{ border: `1.5px solid ${accent || '#2D4A35'}`, background: 'white' }}
          />
        );
      }
      return (
        <div className="flex items-center justify-end gap-0.5 group">
          {isOverride && (
            <button onClick={onClear} className="opacity-0 group-hover:opacity-100 transition px-1 text-xs hover:bg-stone-100 rounded" title="Override entfernen" style={{ color: '#A04030' }}>↶</button>
          )}
          <button
            onClick={() => setEditing(true)}
            className="tabular-nums px-2 py-1 rounded transition hover:bg-stone-100 flex items-center gap-1 text-sm"
            style={{ color: isOverride ? '#A04030' : (accent || '#1F1611'), fontWeight: isOverride ? 600 : 400 }}
            title="Klicken zum Überschreiben"
          >
            {isOverride && <span className="text-[10px]">●</span>}
            <span>{value}</span>
          </button>
        </div>
      );
    }

    // ─── Main component ────────────────────────────────────────────────────
    function Wirtsbuch() {
      const today = new Date();
      const [year, setYear] = useState(today.getFullYear());
      const [month, setMonth] = useState(today.getMonth());
      const DEFAULT_ITEMS = [
        { id: 'weizen', name: 'Weizen' },
        { id: 'wein', name: 'Wein' },
        { id: 'sonstalk', name: 'Sonst. Alkohol' },
        { id: 'wasser', name: 'Wasser' },
        { id: 'apfelschorle', name: 'Apfelschorle' },
        { id: 'spezicola', name: 'Spezi/Cola' },
        { id: 'brotzeitteller', name: 'Brotzeitteller' },
        { id: 'wurstsalat', name: 'Wurstsalat' },
      ];
      const [items, setItems] = useState(DEFAULT_ITEMS);
      const [itemsLoaded, setItemsLoaded] = useState(false);
      const [monthData, setMonthData] = useState({ totals: {}, closedDates: [], overrides: {}, reshuffleNonce: 0, beerLiters: 400 });
      const [monthLoaded, setMonthLoaded] = useState(false);
      const [monthImage, setMonthImage] = useState(null);
      const [imageModalOpen, setImageModalOpen] = useState(false);
      const loadedKeyRef = useRef(null);

      useEffect(() => {
        const data = loadKey('wirtsbuch:items');
        if (data && Array.isArray(data) && data.length > 0) setItems(data);
        setItemsLoaded(true);
      }, []);

      useEffect(() => { if (itemsLoaded) saveKey('wirtsbuch:items', items); }, [items, itemsLoaded]);

      useEffect(() => {
        setMonthLoaded(false);
        loadedKeyRef.current = null;
        const key = `wirtsbuch:month:${year}-${String(month + 1).padStart(2, '0')}`;
        const data = loadKey(key);
        setMonthData({
          totals: data?.totals || {},
          closedDates: data?.closedDates || [],
          overrides: data?.overrides || {},
          reshuffleNonce: data?.reshuffleNonce || 0,
          beerLiters: typeof data?.beerLiters === 'number' ? data.beerLiters : 400,
        });
        loadedKeyRef.current = key;
        setMonthLoaded(true);
      }, [year, month]);

      useEffect(() => {
        if (!monthLoaded) return;
        const key = `wirtsbuch:month:${year}-${String(month + 1).padStart(2, '0')}`;
        if (loadedKeyRef.current !== key) return;
        saveKey(key, monthData);
      }, [monthData, monthLoaded, year, month]);

      // Bild pro Monat laden
      useEffect(() => {
        const key = `wirtsbuch:image:${year}-${String(month + 1).padStart(2, '0')}`;
        let cancelled = false;
        try {
          const v = localStorage.getItem(key);
          if (!cancelled) setMonthImage(v || null);
        } catch (e) { if (!cancelled) setMonthImage(null); }
        return () => { cancelled = true; };
      }, [year, month]);

      function compressImage(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
              const MAX = 1200;
              let w = img.width, h = img.height;
              if (w > MAX || h > MAX) {
                if (w >= h) { h = Math.round(h * (MAX / w)); w = MAX; }
                else { w = Math.round(w * (MAX / h)); h = MAX; }
              }
              const canvas = document.createElement('canvas');
              canvas.width = w; canvas.height = h;
              canvas.getContext('2d').drawImage(img, 0, 0, w, h);
              resolve(canvas.toDataURL('image/jpeg', 0.85));
            };
            img.onerror = reject;
            img.src = e.target.result;
          };
          reader.onerror = reject;
          reader.readAsDataURL(file);
        });
      }

      async function handleImageUpload(file) {
        if (!file || !file.type.startsWith('image/')) return;
        try {
          const dataUrl = await compressImage(file);
          const key = `wirtsbuch:image:${year}-${String(month + 1).padStart(2, '0')}`;
          try {
            localStorage.setItem(key, dataUrl);
            setMonthImage(dataUrl);
          } catch (e) {
            alert('Bild konnte nicht gespeichert werden – Speicher voll. Bitte ältere Belege löschen.');
          }
        } catch (e) {
          alert('Bild konnte nicht verarbeitet werden.');
        }
      }

      function removeImage() {
        if (!confirm('Beleg-Foto für diesen Monat löschen?')) return;
        const key = `wirtsbuch:image:${year}-${String(month + 1).padStart(2, '0')}`;
        try { localStorage.removeItem(key); } catch (e) {}
        setMonthImage(null);
      }

      function loadDefaultItems() {
        if (!confirm('Aktuelle Gerichteliste durch die Beispielliste (Mai-Vordruck) ersetzen?\n\nFür diesen Monat eingegebene Mengen der bisherigen Gerichte werden ausgeblendet (bleiben aber im Speicher und tauchen wieder auf, falls Sie die ursprünglichen Gerichte wiederherstellen).')) return;
        setItems(DEFAULT_ITEMS);
      }

      const holidays = useMemo(() => getBavarianHolidays(year), [year]);

      const beerSchwundPercent = useMemo(() => {
        const rng = seededRandom(year * 1000 + month * 31 + 7919 + monthData.reshuffleNonce * 13);
        return 6 + rng() * 2;
      }, [year, month, monthData.reshuffleNonce]);

      const beerHalbeTotal = useMemo(() => Math.floor(monthData.beerLiters * 2 * (1 - beerSchwundPercent / 100)), [beerSchwundPercent, monthData.beerLiters]);

      const allDays = useMemo(() => {
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const closedSet = new Set(monthData.closedDates);
        const days = [];
        for (let d = 1; d <= daysInMonth; d++) {
          const dt = new Date(year, month, d);
          const dow = dt.getDay();
          const dateStr = dateToStr(year, month, d);
          const isWed = dow === 3;
          const isManClosed = closedSet.has(dateStr);
          days.push({
            date: dateStr, day: d, dayOfWeek: dow,
            isWednesday: isWed, isManuallyClosed: isManClosed,
            isOpen: !isWed && !isManClosed,
            holiday: holidays[dateStr] || null,
          });
        }
        return days;
      }, [year, month, monthData.closedDates, holidays]);

      const openDays = useMemo(() => allDays.filter(d => d.isOpen), [allDays]);
      const monthHolidays = useMemo(() => allDays.filter(d => d.holiday).map(d => ({ date: d.date, day: d.day, dow: d.dayOfWeek, name: d.holiday })), [allDays]);

      const distribution = useMemo(() => {
        const baseSeed = year * 10000 + month * 100 + monthData.reshuffleNonce * 7;
        const result = { beer: distributeAmount(beerHalbeTotal, openDays, monthData.overrides.beer, baseSeed + 1) };
        items.forEach((it, i) => {
          result[it.id] = distributeAmount(monthData.totals[it.id] || 0, openDays, monthData.overrides[it.id], baseSeed + 10 + i * 17);
        });
        return result;
      }, [items, openDays, beerHalbeTotal, year, month, monthData.reshuffleNonce, monthData.totals, monthData.overrides]);

      const todayStr = dateToStr(today.getFullYear(), today.getMonth(), today.getDate());

      function changeMonth(delta) {
        let m = month + delta, y = year;
        if (m < 0) { m = 11; y--; }
        if (m > 11) { m = 0; y++; }
        setMonth(m); setYear(y);
      }
      function toggleClosed(dateStr, isWed) {
        if (isWed) return;
        setMonthData(prev => {
          const set = new Set(prev.closedDates);
          if (set.has(dateStr)) set.delete(dateStr); else set.add(dateStr);
          return { ...prev, closedDates: Array.from(set) };
        });
      }
      function addItem() { setItems(prev => [...prev, { id: `it_${Date.now()}`, name: 'Neues Gericht' }]); }
      function removeItem(id) {
        setItems(prev => prev.filter(it => it.id !== id));
        setMonthData(prev => {
          const { [id]: _t, ...restTotals } = prev.totals;
          const { [id]: _o, ...restOverrides } = prev.overrides;
          return { ...prev, totals: restTotals, overrides: restOverrides };
        });
      }
      function updateItemName(id, name) { setItems(prev => prev.map(it => it.id === id ? { ...it, name } : it)); }
      function updateItemTotal(id, total) { setMonthData(prev => ({ ...prev, totals: { ...prev.totals, [id]: total } })); }
      function setOverride(targetId, dateStr, value) {
        setMonthData(prev => ({ ...prev, overrides: { ...prev.overrides, [targetId]: { ...(prev.overrides[targetId] || {}), [dateStr]: value } } }));
      }
      function clearOverride(targetId, dateStr) {
        setMonthData(prev => {
          const t = { ...(prev.overrides[targetId] || {}) };
          delete t[dateStr];
          const newOverrides = { ...prev.overrides };
          if (Object.keys(t).length === 0) delete newOverrides[targetId];
          else newOverrides[targetId] = t;
          return { ...prev, overrides: newOverrides };
        });
      }
      function reshuffle() { setMonthData(prev => ({ ...prev, reshuffleNonce: prev.reshuffleNonce + 1 })); }
      function resetMonth() {
        if (!confirm(`Alle Eingaben für ${MONTHS[month]} ${year} verwerfen?`)) return;
        setMonthData({ totals: {}, closedDates: [], overrides: {}, reshuffleNonce: 0, beerLiters: 400 });
      }

      function exportCSV() {
        const sep = ';';
        const header = ['Datum', 'Wochentag', 'Status', 'Feiertag', 'Bier (Halbe)', ...items.map(i => i.name)];
        const rows = [header];
        allDays.forEach(d => {
          const row = [
            `${String(d.day).padStart(2, '0')}.${String(month + 1).padStart(2, '0')}.${year}`,
            WEEKDAYS_LONG[d.dayOfWeek],
            d.isOpen ? 'Geöffnet' : (d.isWednesday ? 'Ruhetag' : 'Geschlossen'),
            d.holiday || '',
          ];
          if (d.isOpen) {
            row.push(distribution.beer[d.date] ?? 0);
            items.forEach(it => row.push(distribution[it.id]?.[d.date] ?? 0));
          } else { row.push('', ...items.map(() => '')); }
          rows.push(row);
        });
        const beerSum = openDays.reduce((s, d) => s + (distribution.beer[d.date] ?? 0), 0);
        rows.push(['SUMME', '', '', '', beerSum, ...items.map(it => openDays.reduce((s, d) => s + (distribution[it.id]?.[d.date] ?? 0), 0))]);
        rows.push(['SOLL', '', '', '', beerHalbeTotal, ...items.map(it => monthData.totals[it.id] || 0)]);
        const csv = rows.map(r => r.map(c => {
          const s = String(c);
          return (s.includes(sep) || s.includes('"') || s.includes('\n')) ? `"${s.replace(/"/g, '""')}"` : s;
        }).join(sep)).join('\r\n');
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = `wirtsbuch_${year}-${String(month + 1).padStart(2, '0')}.csv`;
        document.body.appendChild(a); a.click(); a.remove();
        URL.revokeObjectURL(url);
      }

      const beerSum = openDays.reduce((s, d) => s + (distribution.beer[d.date] ?? 0), 0);
      const beerMismatch = beerSum !== beerHalbeTotal;
      const firstDow = (new Date(year, month, 1).getDay() + 6) % 7;

      return (
        <div className="min-h-screen w-full">
          <div className="max-w-6xl mx-auto px-6 py-10">
            <header className="border-b-2 pb-6 mb-8 flex items-end justify-between flex-wrap gap-4" style={{ borderColor: '#2D4A35' }}>
              <div>
                <div className="flex items-baseline gap-3">
                  <h1 className="display text-5xl font-semibold tracking-tight" style={{ color: '#2D4A35' }}>Wirtsbuch</h1>
                  <span className="text-xs uppercase tracking-[0.2em]" style={{ color: '#8B7355' }}>Verbrauchsverteilung</span>
                </div>
                <p className="mt-1 text-sm" style={{ color: '#6B5D52' }}>
                  Monatssummen, plausibel auf Öffnungstage verteilt · Daten werden lokal im Browser gespeichert
                </p>
              </div>
              <div className="flex items-center gap-2 bg-white border rounded-full px-2 py-1" style={{ borderColor: '#D4C7AE' }}>
                <button onClick={() => changeMonth(-1)} className="p-1.5 rounded-full hover:bg-stone-100 transition" aria-label="Vorheriger Monat"><ChevronLeft size={16} /></button>
                <h2 className="display text-lg font-medium px-3 min-w-[160px] text-center" style={{ color: '#2D4A35' }}>{MONTHS[month]} {year}</h2>
                <button onClick={() => changeMonth(1)} className="p-1.5 rounded-full hover:bg-stone-100 transition" aria-label="Nächster Monat"><ChevronRight size={16} /></button>
              </div>
            </header>

            <div className="grid lg:grid-cols-2 gap-8 mb-10">
              <section>
                <div className="flex items-center gap-2 mb-4">
                  <UtensilsCrossed size={16} style={{ color: '#2D4A35' }} />
                  <h3 className="display text-xl font-medium" style={{ color: '#2D4A35' }}>Monatsverbrauch</h3>
                </div>
                <div className="bg-white border rounded-lg p-4 mb-3 flex items-center gap-4" style={{ borderColor: '#D4C7AE', borderLeft: '4px solid #C8964B' }}>
                  <div className="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0" style={{ background: '#FAEFD8' }}>
                    <Beer size={18} style={{ color: '#C8964B' }} />
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="font-medium">Bier</div>
                    <div className="text-xs" style={{ color: '#8B7355' }}>
                      Einkauf in Litern · {beerSchwundPercent.toFixed(1)} % Schwund · ergibt {beerHalbeTotal} Halbe
                    </div>
                  </div>
                  <div className="flex items-center gap-1">
                    <input
                      type="number"
                      min="0"
                      step="1"
                      value={monthData.beerLiters}
                      onChange={(e) => setMonthData(prev => ({ ...prev, beerLiters: Math.max(0, parseInt(e.target.value) || 0) }))}
                      className="w-20 px-2 py-1.5 text-right rounded tabular-nums text-sm focus:outline-none border"
                      style={{ background: '#FAF5E9', borderColor: '#E0D4B8' }}
                    />
                    <span className="text-sm" style={{ color: '#8B7355' }}>L</span>
                  </div>
                </div>
                {items.map(item => (
                  <div key={item.id} className="bg-white border rounded-lg p-3 mb-2 flex items-center gap-3" style={{ borderColor: '#D4C7AE' }}>
                    <input type="text" value={item.name} onChange={(e) => updateItemName(item.id, e.target.value)} className="flex-1 bg-transparent border-b border-transparent hover:border-stone-300 focus:border-stone-500 focus:outline-none px-1 py-0.5 text-sm" />
                    <input type="number" min="0" value={monthData.totals[item.id] || ''} placeholder="0" onChange={(e) => updateItemTotal(item.id, Math.max(0, parseInt(e.target.value) || 0))} className="w-24 px-2 py-1.5 text-right rounded tabular-nums text-sm focus:outline-none border" style={{ background: '#FAF5E9', borderColor: '#E0D4B8' }} />
                    <button onClick={() => removeItem(item.id)} className="p-1.5 text-stone-400 hover:text-red-700 transition" aria-label="Entfernen"><Trash2 size={15} /></button>
                  </div>
                ))}
                <div className="mt-2 grid grid-cols-2 gap-2">
                  <button onClick={addItem} className="flex items-center gap-2 justify-center px-3 py-2.5 text-sm border border-dashed rounded-lg transition hover:bg-white" style={{ borderColor: '#2D4A35', color: '#2D4A35' }}>
                    <Plus size={15} /> Gericht hinzufügen
                  </button>
                  <button onClick={loadDefaultItems} className="flex items-center gap-2 justify-center px-3 py-2.5 text-sm border border-dashed rounded-lg transition hover:bg-white" style={{ borderColor: '#8B7355', color: '#8B7355' }} title="Standard-Liste aus dem Vordruck laden">
                    <RotateCcw size={14} /> Beispielliste laden
                  </button>
                </div>
                <p className="mt-3 text-xs flex items-start gap-1.5" style={{ color: '#8B7355' }}>
                  <Info size={12} className="mt-0.5 flex-shrink-0" />
                  Geben Sie am Monatsende die tatsächlich verkaufte Gesamtmenge je Gericht ein. Beim Bier wird der Einkauf in Litern eingetragen; die Halben werden abzüglich Schwund berechnet.
                </p>
              </section>

              <section>
                <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
                  <h3 className="display text-xl font-medium" style={{ color: '#2D4A35' }}>Öffnungstage</h3>
                  <div className="flex items-center gap-2">
                    <button onClick={reshuffle} className="flex items-center gap-1.5 text-xs px-3 py-1.5 border rounded-full hover:bg-white transition" style={{ borderColor: '#2D4A35', color: '#2D4A35' }}>
                      <Shuffle size={12} /> Neu verteilen
                    </button>
                    <button onClick={resetMonth} className="flex items-center gap-1.5 text-xs px-3 py-1.5 border rounded-full hover:bg-white transition" style={{ borderColor: '#A04030', color: '#A04030' }} title="Alle Eingaben für diesen Monat verwerfen">
                      <RotateCcw size={12} /> Zurücksetzen
                    </button>
                  </div>
                </div>
                <div className="bg-white border rounded-lg p-4" style={{ borderColor: '#D4C7AE' }}>
                  <div className="grid grid-cols-7 gap-1.5 mb-2 text-[10px] uppercase tracking-wider font-medium text-center" style={{ color: '#8B7355' }}>
                    {WEEKDAYS_SHORT.map(d => <div key={d}>{d}</div>)}
                  </div>
                  <div className="grid grid-cols-7 gap-1.5">
                    {Array.from({ length: firstDow }).map((_, i) => <div key={`e${i}`} />)}
                    {allDays.map(d => {
                      const isToday = d.date === todayStr;
                      let bg = '#E5EDDB', fg = '#2D4A35', extraClass = '';
                      if (d.isWednesday) { bg = '#EDE5D5'; fg = '#9A8B7A'; }
                      else if (d.isManuallyClosed) { bg = '#F4D5CC'; fg = '#A04030'; extraClass = 'closed-stripe'; }
                      return (
                        <button key={d.date} onClick={() => toggleClosed(d.date, d.isWednesday)} disabled={d.isWednesday}
                          className={`aspect-square flex flex-col items-center justify-center rounded text-sm transition relative ${d.isWednesday ? 'cursor-not-allowed' : 'cursor-pointer hover:scale-105'} ${extraClass}`}
                          style={{ background: bg, color: fg, boxShadow: isToday ? `inset 0 0 0 2px #C8964B` : 'none' }}
                          title={`${WEEKDAYS_LONG[d.dayOfWeek]}${d.holiday ? ` · ${d.holiday}` : ''}${d.isWednesday ? ' (Ruhetag)' : (d.isManuallyClosed ? ' (geschlossen)' : '')}`}>
                          <span className="font-medium">{d.day}</span>
                          {d.holiday && <span className="absolute top-1 right-1 w-1.5 h-1.5 rounded-full" style={{ background: '#7C3AED' }} aria-label="Feiertag" />}
                        </button>
                      );
                    })}
                  </div>
                  <div className="flex flex-wrap gap-3 mt-4 text-xs" style={{ color: '#6B5D52' }}>
                    <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded" style={{ background: '#E5EDDB' }} /> Geöffnet</div>
                    <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded" style={{ background: '#EDE5D5' }} /> Ruhetag</div>
                    <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded closed-stripe" style={{ background: '#F4D5CC' }} /> Geschlossen</div>
                    <div className="flex items-center gap-1.5"><div className="w-3 h-3 rounded" style={{ boxShadow: 'inset 0 0 0 2px #C8964B' }} /> Heute</div>
                    <div className="flex items-center gap-1.5"><div className="w-1.5 h-1.5 rounded-full" style={{ background: '#7C3AED' }} /> Feiertag</div>
                  </div>
                  <p className="text-xs mt-3 italic flex items-start gap-1.5" style={{ color: '#8B7355' }}>
                    <Info size={12} className="mt-0.5 flex-shrink-0" />
                    Tag anklicken zum Schließen/Öffnen. Feiertage sind nur markiert, nicht automatisch geschlossen.
                  </p>
                </div>
                {monthHolidays.length > 0 && (
                  <div className="mt-3 bg-white border rounded-lg p-3" style={{ borderColor: '#D4C7AE' }}>
                    <div className="text-xs uppercase tracking-wider mb-2 font-medium" style={{ color: '#7C3AED' }}>Bayerische Feiertage in {MONTHS[month]}</div>
                    <div className="space-y-1">
                      {monthHolidays.map(h => (
                        <div key={h.date} className="text-sm flex items-center gap-2">
                          <span className="tabular-nums font-medium" style={{ color: '#2D4A35' }}>{String(h.day).padStart(2, '0')}.{String(month + 1).padStart(2, '0')}.</span>
                          <span style={{ color: '#6B5D52' }}>{WEEKDAYS_SHORT[(h.dow + 6) % 7]}</span>
                          <span>·</span>
                          <span>{h.name}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                <div className="mt-3 grid grid-cols-3 gap-3 text-xs">
                  <div className="bg-white border rounded-lg p-3" style={{ borderColor: '#D4C7AE' }}>
                    <div style={{ color: '#8B7355' }}>Öffnungstage</div>
                    <div className="display text-2xl font-medium" style={{ color: '#2D4A35' }}>{openDays.length}</div>
                  </div>
                  <div className="bg-white border rounded-lg p-3" style={{ borderColor: '#D4C7AE' }}>
                    <div style={{ color: '#8B7355' }}>Ruhetage (Mi)</div>
                    <div className="display text-2xl font-medium" style={{ color: '#2D4A35' }}>{allDays.filter(d => d.isWednesday).length}</div>
                  </div>
                  <div className="bg-white border rounded-lg p-3" style={{ borderColor: '#D4C7AE' }}>
                    <div style={{ color: '#8B7355' }}>Geschlossen</div>
                    <div className="display text-2xl font-medium" style={{ color: '#A04030' }}>{allDays.filter(d => d.isManuallyClosed).length}</div>
                  </div>
                </div>

                {/* Beleg-Foto */}
                <div className="mt-3 bg-white border rounded-lg p-3" style={{ borderColor: '#D4C7AE' }}>
                  <div className="flex items-center justify-between mb-2">
                    <div className="text-xs uppercase tracking-wider font-medium" style={{ color: '#2D4A35' }}>Beleg-Foto</div>
                    {monthImage && (
                      <button onClick={removeImage} className="text-xs flex items-center gap-1 hover:underline" style={{ color: '#A04030' }} title="Beleg löschen">
                        <Trash2 size={12} /> Entfernen
                      </button>
                    )}
                  </div>
                  {monthImage ? (
                    <div className="space-y-2">
                      <button onClick={() => setImageModalOpen(true)} className="block w-full overflow-hidden rounded border hover:opacity-90 transition" style={{ borderColor: '#E0D4B8' }} title="Vergrößert anzeigen">
                        <img src={monthImage} alt="Beleg-Foto" className="w-full max-h-48 object-contain bg-stone-100" />
                      </button>
                      <p className="text-[10px]" style={{ color: '#8B7355' }}>Klick auf das Bild für die Vollansicht. Pro Monat ein Beleg.</p>
                    </div>
                  ) : (
                    <label className="flex items-center gap-2 justify-center px-3 py-3 text-sm border border-dashed rounded-lg transition hover:bg-stone-50 cursor-pointer" style={{ borderColor: '#2D4A35', color: '#2D4A35' }}>
                      <Camera size={15} />
                      Foto hochladen
                      <input type="file" accept="image/*" className="hidden" onChange={(e) => { if (e.target.files?.[0]) handleImageUpload(e.target.files[0]); e.target.value = ''; }} />
                    </label>
                  )}
                </div>
              </section>
            </div>

            {/* Modal: Bild in voller Größe */}
            {imageModalOpen && monthImage && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{ background: 'rgba(31,22,17,0.85)' }} onClick={() => setImageModalOpen(false)}>
                <button onClick={() => setImageModalOpen(false)} className="absolute top-4 right-4 p-2 rounded-full bg-white/10 hover:bg-white/20 text-white transition" aria-label="Schließen">
                  <X size={20} />
                </button>
                <img src={monthImage} alt="Beleg-Foto Vollansicht" className="max-w-full max-h-full object-contain" onClick={(e) => e.stopPropagation()} />
              </div>
            )}

            <section className="mb-8">
              <div className="flex items-center justify-between mb-4 flex-wrap gap-3">
                <div>
                  <h3 className="display text-xl font-medium" style={{ color: '#2D4A35' }}>Tagesverteilung</h3>
                  <p className="text-xs mt-0.5 flex items-center gap-1.5" style={{ color: '#8B7355' }}>
                    <Pencil size={11} /> Auf eine Zahl klicken, um den Tageswert manuell zu setzen. Der Rest verteilt sich auf die übrigen Tage neu.
                  </p>
                </div>
                <button onClick={exportCSV} className="flex items-center gap-2 px-4 py-2 rounded-lg text-white text-sm font-medium transition hover:opacity-90" style={{ background: '#2D4A35' }}>
                  <Download size={15} /> CSV exportieren
                </button>
              </div>
              <div className="bg-white border rounded-lg overflow-hidden" style={{ borderColor: '#D4C7AE' }}>
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead style={{ background: '#2D4A35', color: '#F4ECDD' }}>
                      <tr>
                        <th className="px-3 py-3 text-left font-medium whitespace-nowrap">Datum</th>
                        <th className="px-3 py-3 text-left font-medium whitespace-nowrap">Wochentag</th>
                        <th className="px-3 py-3 text-right font-medium whitespace-nowrap"><div className="flex items-center justify-end gap-1.5"><Beer size={13} /> Halbe</div></th>
                        {items.map(it => <th key={it.id} className="px-3 py-3 text-right font-medium whitespace-nowrap">{it.name}</th>)}
                      </tr>
                    </thead>
                    <tbody>
                      {allDays.map(d => {
                        const isToday = d.date === todayStr;
                        const beerOv = monthData.overrides.beer && Object.prototype.hasOwnProperty.call(monthData.overrides.beer, d.date);
                        return (
                          <tr key={d.date} className="border-t" style={{ borderColor: '#EAE0CC', background: !d.isOpen ? '#FAF5E9' : (isToday ? '#FFFCF3' : 'white') }}>
                            <td className="px-3 py-2 tabular-nums whitespace-nowrap">
                              <span className="inline-flex items-center gap-1">
                                {String(d.day).padStart(2, '0')}.{String(month + 1).padStart(2, '0')}.
                                {d.holiday && <span className="w-1.5 h-1.5 rounded-full inline-block" style={{ background: '#7C3AED' }} title={d.holiday} />}
                              </span>
                            </td>
                            <td className="px-3 py-2 whitespace-nowrap">
                              <span style={{ color: d.isOpen ? '#1F1611' : '#9A8B7A' }}>
                                {WEEKDAYS_LONG[d.dayOfWeek]}
                                {d.holiday && <span className="ml-1 text-xs" style={{ color: '#7C3AED' }}>· {d.holiday}</span>}
                                {!d.isOpen && <span className="ml-2 text-xs italic">{d.isWednesday ? '(Ruhetag)' : '(geschlossen)'}</span>}
                              </span>
                            </td>
                            <td className="px-3 py-1">
                              <ValueCell value={distribution.beer[d.date] ?? 0} isOverride={beerOv && d.isOpen} disabled={!d.isOpen} onSet={(n) => setOverride('beer', d.date, n)} onClear={() => clearOverride('beer', d.date)} accent="#C8964B" />
                            </td>
                            {items.map(it => {
                              const ov = monthData.overrides[it.id] && Object.prototype.hasOwnProperty.call(monthData.overrides[it.id], d.date);
                              return (
                                <td key={it.id} className="px-3 py-1">
                                  <ValueCell value={distribution[it.id]?.[d.date] ?? 0} isOverride={ov && d.isOpen} disabled={!d.isOpen} onSet={(n) => setOverride(it.id, d.date, n)} onClear={() => clearOverride(it.id, d.date)} />
                                </td>
                              );
                            })}
                          </tr>
                        );
                      })}
                      <tr className="border-t-2" style={{ borderColor: '#2D4A35', background: '#F4ECDD' }}>
                        <td className="px-3 py-3 font-semibold display" colSpan="2">SUMME</td>
                        <td className="px-3 py-3 text-right font-semibold tabular-nums display" style={{ color: beerMismatch ? '#A04030' : '#C8964B' }}>
                          <div className="flex items-center justify-end gap-1.5">
                            {beerMismatch && <span title={`Soll: ${beerHalbeTotal} – Overrides überschreiten den Sollwert`}><AlertTriangle size={14} /></span>}
                            <span>{beerSum}</span>
                          </div>
                          {beerMismatch && <div className="text-[10px] font-normal" style={{ color: '#A04030' }}>Soll: {beerHalbeTotal}</div>}
                        </td>
                        {items.map(it => {
                          const sum = openDays.reduce((s, d) => s + (distribution[it.id]?.[d.date] ?? 0), 0);
                          const target = monthData.totals[it.id] || 0;
                          const mismatch = sum !== target;
                          return (
                            <td key={it.id} className="px-3 py-3 text-right font-semibold tabular-nums display" style={{ color: mismatch ? '#A04030' : '#1F1611' }}>
                              <div className="flex items-center justify-end gap-1.5">
                                {mismatch && <span title={`Soll: ${target} – Overrides überschreiten den Sollwert`}><AlertTriangle size={14} /></span>}
                                <span>{sum}</span>
                              </div>
                              {mismatch && <div className="text-[10px] font-normal" style={{ color: '#A04030' }}>Soll: {target}</div>}
                            </td>
                          );
                        })}
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </section>
            <footer className="text-xs text-center py-4" style={{ color: '#8B7355' }}>
              Gewichtung: Sa &gt; So &gt; Fr &gt; Do &gt; Mo/Di · ±35 % Tagesstreuung · Daten lokal im Browser gespeichert · Bayerische Feiertage automatisch erkannt
            </footer>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Wirtsbuch />);
  </script>
</body>
</html>
